<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Carrossel Unidcom — IA no SAC: Risco de Marca</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"><\/script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: 'Inter', sans-serif;
    }
    .carousel { position: relative; width: 420px; }
    .slide {
      display: none;
      width: 420px;
      height: 525px;
      position: relative;
      overflow: hidden;
    }
    .slide.active { display: block; }
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
    }
    .nav button {
      background: #333; color: #fff; border: none;
      padding: 8px 20px; border-radius: 4px;
      cursor: pointer; font-size: 13px;
    }
    .nav button:hover { background: #555; }
    .slide-counter { color: #aaa; font-size: 13px; font-family: sans-serif; }

    /* SLIDE 1 */
    #slide-1 .cover-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover; z-index: 0;
    }
    #slide-1 .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(155deg, rgba(0,75,38,0.84) 0%, rgba(5,30,15,0.93) 100%);
      z-index: 1;
    }
    #slide-1 .content {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 30px 28px;
    }
    #slide-1 .tag {
      background: #00875A; color: #fff; font-size: 9px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 5px 10px; border-radius: 3px;
      display: inline-block; width: fit-content;
    }
    #slide-1 .headline {
      color: #fff; font-size: 38px; font-weight: 900;
      line-height: 1.08; letter-spacing: -1.5px;
    }
    #slide-1 .accent { color: #57D9A3; }
    #slide-1 .sub {
      color: rgba(255,255,255,0.65); font-size: 12px;
      font-weight: 500; margin-top: 10px; line-height: 1.5;
    }
    #slide-1 .logo-wrap { display: flex; justify-content: flex-end; }
    #slide-1 .logo { height: 22px; opacity: 0.9; }

    /* SLIDE 2 */
    #slide-2 { background: #0D3D26; }
    #slide-2 .content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 30px 28px;
    }
    #slide-2 .bg-num {
      position: absolute; top: 8px; right: 16px;
      font-size: 100px; font-weight: 900;
      color: rgba(87,217,163,0.08); line-height: 1;
      font-family: 'Inter', sans-serif; z-index: 0;
    }
    #slide-2 .inner { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    #slide-2 .eyebrow {
      color: #57D9A3; font-size: 10px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
    }
    #slide-2 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
    #slide-2 .label {
      color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px;
    }
    #slide-2 .quote { color: #fff; font-size: 22px; font-weight: 700; line-height: 1.35; }
    #slide-2 .accent { color: #57D9A3; }
    #slide-2 .logo { height: 20px; }

    /* SLIDE 3 */
    #slide-3 { background: #fff; }
    #slide-3 .accent-bar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #00875A;
    }
    #slide-3 .content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 30px 28px 30px 36px;
    }
    #slide-3 .eyebrow {
      color: #00875A; font-size: 10px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
    }
    #slide-3 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 0; }
    #slide-3 .stat {
      font-size: 72px; font-weight: 900; color: #00875A; line-height: 1; letter-spacing: -3px;
    }
    #slide-3 .stat-label { font-size: 13px; color: #444; font-weight: 600; margin-top: 6px; line-height: 1.45; }
    #slide-3 .divider { width: 40px; height: 3px; background: #00875A; margin: 16px 0; }
    #slide-3 .desc { font-size: 16px; color: #222; font-weight: 600; line-height: 1.45; }
    #slide-3 .accent { color: #00875A; }
    #slide-3 .logo { height: 20px; }

    /* SLIDE 4 */
    #slide-4 { background: #006644; }
    #slide-4 .content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 28px 24px;
    }
    #slide-4 .eyebrow {
      color: #57D9A3; font-size: 10px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
    }
    #slide-4 .chat-box {
      background: rgba(0,0,0,0.28); border-radius: 10px;
      padding: 16px 18px; border-left: 4px solid #FF5C5C;
    }
    #slide-4 .chat-label {
      color: #FF8C8C; font-size: 9px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px;
    }
    #slide-4 .chat-text { color: #fff; font-size: 14px; line-height: 1.5; }
    #slide-4 .chat-error { color: #FF8C8C; font-size: 12px; margin-top: 6px; font-style: italic; }
    #slide-4 .consequence {
      background: rgba(255,255,255,0.09); border-radius: 8px; padding: 14px 16px;
    }
    #slide-4 .consequence-text { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 600; line-height: 1.45; }
    #slide-4 .accent { color: #57D9A3; }
    #slide-4 .logo { height: 20px; }

    /* SLIDE 5 */
    #slide-5 { background: #F4FBF7; }
    #slide-5 .content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 28px 26px;
    }
    #slide-5 .eyebrow {
      color: #00875A; font-size: 10px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
    }
    #slide-5 .title { font-size: 18px; font-weight: 800; color: #0D3D26; line-height: 1.3; margin-top: 6px; }
    #slide-5 .steps { display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center; padding: 8px 0; }
    #slide-5 .step { display: flex; align-items: flex-start; gap: 12px; }
    #slide-5 .step-num {
      background: #00875A; color: #fff; font-size: 11px; font-weight: 800;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #slide-5 .step-text { font-size: 13px; color: #222; font-weight: 600; line-height: 1.4; padding-top: 4px; }
    #slide-5 .accent { color: #00875A; }
    #slide-5 .logo { height: 20px; }

    /* SLIDE 6 */
    #slide-6 { background: #00875A; }
    #slide-6 .content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 36px 28px; text-align: center;
    }
    #slide-6 .big-quote { color: #fff; font-size: 30px; font-weight: 900; line-height: 1.2; letter-spacing: -0.5px; }
    #slide-6 .accent { color: #57D9A3; }
    #slide-6 .divider { width: 50px; height: 3px; background: #57D9A3; margin: 20px auto; }
    #slide-6 .sub-quote { color: rgba(255,255,255,0.78); font-size: 15px; font-weight: 600; line-height: 1.55; }
    #slide-6 .sub-quote strong { color: #fff; }

    /* SLIDE 7 */
    #slide-7 { background: #0D3D26; }
    #slide-7 .content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 30px 26px;
    }
    #slide-7 .eyebrow {
      color: #57D9A3; font-size: 10px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
    }
    #slide-7 .cta-title { color: #fff; font-size: 24px; font-weight: 900; line-height: 1.28; margin-top: 10px; }
    #slide-7 .accent { color: #57D9A3; }
    #slide-7 .cta-sub { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500; line-height: 1.5; margin-top: 10px; }
    #slide-7 .cta-btn {
      background: #57D9A3; color: #0D3D26; font-size: 11px; font-weight: 800;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 12px 20px; border-radius: 4px;
      display: inline-block; margin-top: 18px; width: fit-content;
    }
    #slide-7 .bottom-row { display: flex; justify-content: space-between; align-items: flex-end; }
    #slide-7 .logo { height: 22px; }
    #slide-7 .tagline { color: rgba(255,255,255,0.35); font-size: 10px; font-weight: 500; }
  </style>
</head>

<div class="nav">
  <button onclick="prevSlide()">&#8592; Anterior</button>
  <span class="slide-counter" id="counter">1 / 7</span>
  <button onclick="nextSlide()">Próximo &#8594;</button>
</div>

<div style="text-align:center;margin:16px 0;font-family:sans-serif;">
  <button id="btnExport" onclick="exportAllSlides()"
    style="background:#00875A;color:#fff;border:none;padding:10px 24px;
           border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;">
    &#8595; EXPORTAR PNG
  </button>
  <span id="exportProgress" style="display:none;margin-left:12px;font-size:13px;color:#aaa;"></span>
</div>

<script>
  const N = 7;
  let current = 0;
  function showSlide(i) {
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    document.getElementById('slide-' + (i + 1)).classList.add('active');
    document.getElementById('counter').textContent = (i + 1) + ' / ' + N;
    current = i;
  }
  function nextSlide() { showSlide((current + 1) % N); }
  function prevSlide() { showSlide((current - 1 + N) % N); }
  async function exportAllSlides() {
    const btn = document.getElementById('btnExport');
    const progress = document.getElementById('exportProgress');
    btn.disabled = true;
    progress.style.display = 'inline-block';
    const SCALE = 1080 / 420;
    for (let i = 0; i < N; i++) {
      showSlide(i);
      progress.textContent = 'Exportando ' + (i + 1) + ' / ' + N + '...';
      await new Promise(r => setTimeout(r, 600));
      const slide = document.getElementById('slide-' + (i + 1));
      const canvas = await html2canvas(slide, {
        scale: SCALE, useCORS: true, allowTaint: false,
        backgroundColor: null, width: 420, height: 525, logging: false
      });
      const link = document.createElement('a');
      link.download = 'slide_' + String(i + 1).padStart(2, '0') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      await new Promise(r => setTimeout(r, 400));
    }
    progress.textContent = 'Exportacao concluida!';
    setTimeout(() => { progress.style.display = 'none'; btn.disabled = false; }, 3000);
    showSlide(0);
  }
</script>
